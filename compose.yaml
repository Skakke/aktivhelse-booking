# Innlevering / demo: én kommando, ingen lagring.
#   docker compose up --build
# Databasen ligger i minnet (tmpfs) og starter med ferske testdata hver gang.
# For utvikling med lagring på disk: se compose.dev.yaml og README.

name: aktivhelse-booking

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      TEST_DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
