{% set gc = c.gc %}
<form hx-post="/classes/{{ gc.id }}/book" hx-target="#modal-body" novalidate>
  <h2>{{ gc.name }}</h2>
  <p class="meta">{{ gc.starts_at | day }} kl. {{ gc.starts_at | clock }} · {{ gc.department.name }} · {{ c.available }} ledige plasser</p>

  {% if errors.skjema %}<p class="alert">{{ errors.skjema }}</p>{% endif %}

  <label>Navn
    <input name="name" value="{{ form.name or '' }}" autocomplete="name" required
           {% if errors.name %}aria-invalid="true"{% endif %}>
    {% if errors.name %}<small class="error">{{ errors.name }}</small>{% endif %}
  </label>

  <label>E-post
    <input name="email" type="email" value="{{ form.email or '' }}" autocomplete="email" required
           {% if errors.email %}aria-invalid="true"{% endif %}>
    {% if errors.email %}<small class="error">{{ errors.email }}</small>{% endif %}
  </label>

  <div class="buttons">
    <button type="button" class="secondary" onclick="this.closest('dialog').close()">Avbryt</button>
    {% if c.bookable %}<button type="submit">Bekreft påmelding</button>{% endif %}
  </div>
</form>
